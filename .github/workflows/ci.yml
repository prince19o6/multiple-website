name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # ==============================================================================
  # Job 1: Backend CI (.NET 8.0 + Tests)
  # ==============================================================================
  backend-ci:
    name: Backend Build & Unit/Isolation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Backend Dependencies
        run: dotnet restore backend/toursApi/ToursApi.csproj

      - name: Build Backend
        run: dotnet build backend/toursApi/ToursApi.csproj --no-restore --configuration Release

      - name: Run Backend Isolation Tests
        run: dotnet test backend/ToursApi.Tests/ToursApi.Tests.csproj --configuration Release --verbosity normal

  # ==============================================================================
  # Job 2: Web CI (Next.js 15 TypeScript & Build)
  # ==============================================================================
  web-ci:
    name: Web Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Type Check (TypeScript)
        working-directory: web
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  # ==============================================================================
  # Job 3: Docker Orchestration Validation
  # ==============================================================================
  docker-validation:
    name: Dockerfile & Compose Syntax Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, web-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
