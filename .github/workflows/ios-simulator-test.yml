name: iOS Simulator Automated Test & Screenshot Pipeline

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Target Website Tenant"
        required: true
        default: "gujjutours"
        type: choice
        options:
          - gujjutours
          - tripgoasia
          - technoheaven
      device:
        description: "iOS Simulator Device"
        required: true
        default: "iPhone 15"
        type: choice
        options:
          - "iPhone 15"
          - "iPhone 15 Pro Max"
          - "iPad Pro (12.9-inch) (6th generation)"

jobs:
  ios-simulator-smoke:
    name: iOS Simulator Build, Maestro & Screenshots
    runs-on: macos-14 # Apple Silicon M1/M2 macOS runner (free tier included)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: my-app/package-lock.json

      - name: Setup Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Install Mobile Dependencies
        working-directory: my-app
        run: npm ci

      - name: Boot iOS Simulator
        run: |
          DEVICE_NAME="${{ github.event.inputs.device || 'iPhone 15' }}"
          echo "Booting simulator: $DEVICE_NAME"
          DEVICE_UDID=$(xcrun simctl list devices available | grep "$DEVICE_NAME" | head -1 | grep -o -E '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Simulator UDID: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID"
          echo "SIMULATOR_UDID=$DEVICE_UDID" >> $GITHUB_ENV

      - name: Prebuild & Build iOS App for Simulator
        working-directory: my-app
        env:
          EXPO_PUBLIC_SITE_ID: ${{ github.event.inputs.site || 'gujjutours' }}
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          xcodebuild -workspace *.xcworkspace \
            -scheme ${{ github.event.inputs.site || 'gujjutours' }} \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            build

      - name: Install App on Simulator
        run: |
          APP_PATH=$(find my-app/ios/build -name "*.app" -type d | head -1)
          echo "Installing $APP_PATH on simulator $SIMULATOR_UDID"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Execute Maestro Smoke Flows & Capture Screenshots
        run: |
          mkdir -p screenshots
          echo "Running Maestro E2E Flows..."
          maestro test .maestro/browse-and-search.yaml
          xcrun simctl io "$SIMULATOR_UDID" screenshot screenshots/01_home_and_search.png
          
          maestro test .maestro/tour-details-and-wishlist.yaml
          xcrun simctl io "$SIMULATOR_UDID" screenshot screenshots/02_tour_details_wishlist.png

          maestro test .maestro/account-deletion.yaml
          xcrun simctl io "$SIMULATOR_UDID" screenshot screenshots/03_account_deletion_alert.png

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.event.inputs.site || 'gujjutours' }}-screenshots
          path: screenshots/
          retention-days: 14

