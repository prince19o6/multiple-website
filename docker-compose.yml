# ==============================================================================
# Multi-Website Travel Platform - Docker Compose Orchestration
# ==============================================================================
# Starts both the ASP.NET Core Backend (Port 5000) and Next.js Frontend (Port 3000).
#
# Usage:
#   docker compose up --build -d
#   docker compose logs -f
#   docker compose down
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API: ASP.NET Core 8.0 + MongoDB Atlas Multi-Tenant Registry
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tours-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - DOTNET_RUNNING_IN_CONTAINER=true
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING:-mongodb+srv://user:pass@cluster.mongodb.net/?retryWrites=true&w=majority}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - tours-network

  # ----------------------------------------------------------------------------
  # Web Frontend: Single Next.js 15 App with Dynamic Tenant Resolution
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tours-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_URL=http://backend:5000
      - BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
      - NEXT_PUBLIC_DEFAULT_LANG=en
      - SITE_ID=${SITE_ID:-tripgoasia}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tours-network

networks:
  tours-network:
    driver: bridge
